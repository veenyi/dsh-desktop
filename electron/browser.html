<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSH 浏览器</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Segoe UI","Microsoft YaHei",sans-serif; height:100vh; display:flex; flex-direction:column; background:#fff; overflow:hidden; }
  .bar { display:flex; align-items:center; gap:6px; padding:8px 10px; background:#f5f6f8; border-bottom:1px solid #e5e7eb; flex:none; }
  .bar button { border:1px solid #d5d8dd; background:#fff; border-radius:7px; padding:5px 10px; font-size:12px; cursor:pointer; color:#1f2328; }
  .bar button:hover { background:#eef1f5; }
  .bar input { flex:1; border:1px solid #d5d8dd; border-radius:7px; padding:6px 10px; font-size:13px; outline:none; }
  .bar input:focus { border-color:#4D6BFE; }
  .main { display:flex; flex:1; min-height:0; }
  #wv { flex:1; border:none; min-width:0; }
  #panel { width:340px; border-left:1px solid #e5e7eb; background:#fafbfc; display:flex; flex-direction:column; flex:none; }
  #panel.hidden { display:none; }
  .p-head { display:flex; align-items:center; gap:6px; padding:8px 10px; background:#f0f2f5; border-bottom:1px solid #e5e7eb; flex:none; }
  .p-head strong { font-size:13px; color:#1f2328; flex:1; }
  .p-head button { border:1px solid #d5d8dd; background:#fff; border-radius:6px; padding:3px 8px; font-size:11px; cursor:pointer; }
  .p-head .ai-toggle { background:#4D6BFE; color:#fff; border-color:#4D6BFE; }
  .p-head .ai-toggle.off { background:#fff; color:#4D6BFE; }
  .p-msgs { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; min-height:0; }
  .msg { max-width:92%; padding:8px 10px; border-radius:10px; font-size:13px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:#4D6BFE; color:#fff; }
  .msg.ai { align-self:flex-start; background:#fff; border:1px solid #e5e7eb; color:#1f2328; }
  .msg.tool { align-self:flex-start; background:#f0f4ff; border:1px solid #d6e4ff; color:#334; font-size:12px; font-family:Consolas,Monaco,monospace; }
  .msg.err { align-self:flex-start; background:#fff0f0; border:1px solid #ffd6d6; color:#c0392b; }
  .p-log { height:120px; border-top:1px solid #e5e7eb; background:#0f1220; color:#9fe8a6; font-family:Consolas,Monaco,monospace; font-size:11px; overflow-y:auto; padding:8px; flex:none; white-space:pre-wrap; }
  .p-input { display:flex; gap:6px; padding:8px; border-top:1px solid #e5e7eb; flex:none; }
  .p-input input { flex:1; border:1px solid #d5d8dd; border-radius:8px; padding:8px 10px; font-size:13px; outline:none; }
  .p-input input:focus { border-color:#4D6BFE; }
  .p-input button { background:#4D6BFE; color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; }
  .p-input button:disabled { opacity:.5; cursor:default; }
  #toggle-panel { border:1px solid #4D6BFE; color:#4D6BFE; background:#fff; }
  #takeover { display:flex; gap:8px; align-items:center; padding:8px; border-top:1px solid #ffe1a8; background:#fff8e6; flex:none; }
  #takeover.hidden { display:none; }
  #takeover .to-txt { flex:1; font-size:12px; color:#8a5a00; line-height:1.45; }
  #takeover button { background:#ffb020; color:#fff; border:none; border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; flex:none; }
  #takeover button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
  <div class="bar">
    <button id="back" title="后退">←</button>
    <button id="fwd" title="前进">→</button>
    <button id="reload" title="刷新">⟳</button>
    <input id="url" placeholder="输入网址，回车访问">
    <button id="ext" title="在系统浏览器打开">外部打开</button>
    <button id="home" title="默认页">🏠</button>
    <button id="toggle-panel" title="AI 侧边面板">🤖 AI</button>
  </div>
  <div class="main">
    <webview id="wv" src="https://www.deepseek.com"></webview>
    <div id="panel" class="hidden">
      <div class="p-head">
        <strong>🤖 AI 浏览器助手</strong>
        <button id="ai-toggle" class="ai-toggle off" title="AI 操作浏览器开关">AI 操作: 关</button>
      </div>
      <div class="p-msgs" id="msgs"></div>
      <div id="takeover" class="hidden">
        <div class="to-txt" id="takeover-txt"></div>
        <button id="takeover-btn">继续</button>
      </div>
      <div class="p-log" id="log">— 操作日志 —</div>
      <div class="p-input">
        <input id="chat-input" placeholder="告诉 AI 做什么，如：搜索'金价'并打开第一个结果">
        <button id="send">发送</button>
      </div>
    </div>
  </div>
<script>
  const wv = document.getElementById('wv');
  const urlInput = document.getElementById('url');
  const msgs = document.getElementById('msgs');
  const logEl = document.getElementById('log');
  const chatInput = document.getElementById('chat-input');
  const panel = document.getElementById('panel');
  let aiEnabled = false;

  function go(u) {
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    wv.loadURL(u); urlInput.value = u;
  }
  wv.addEventListener('did-navigate', e => urlInput.value = e.url);
  wv.addEventListener('did-navigate-in-page', e => urlInput.value = e.url);
  wv.addEventListener('page-title-updated', e => document.title = e.title + ' — DSH 浏览器');
  document.getElementById('back').addEventListener('click', () => wv.canGoBack() && wv.goBack());
  document.getElementById('fwd').addEventListener('click', () => wv.canGoForward() && wv.goForward());
  document.getElementById('reload').addEventListener('click', () => wv.reload());
  document.getElementById('home').addEventListener('click', () => go('https://www.deepseek.com'));
  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') go(urlInput.value); });
  document.getElementById('ext').addEventListener('click', () => {
    if (typeof window.__dshShell !== 'undefined') window.__dshShell.openExternal(urlInput.value || wv.getURL());
  });
  wv.addEventListener('new-window', e => { e.preventDefault(); if (typeof window.__dshShell !== 'undefined') window.__dshShell.openExternal(e.url); });

  function addMsg(kind, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + kind;
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
  }
  function addLog(line) {
    logEl.textContent += line + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }
  document.getElementById('toggle-panel').addEventListener('click', () => { panel.classList.toggle('hidden'); });
  document.getElementById('ai-toggle').addEventListener('click', () => {
    aiEnabled = !aiEnabled;
    const b = document.getElementById('ai-toggle');
    b.textContent = 'AI 操作: ' + (aiEnabled ? '开' : '关');
    b.classList.toggle('off', !aiEnabled);
    addLog('AI 操作' + (aiEnabled ? '开启' : '关闭'));
  });

  async function sendChat() {
    const text = chatInput.value.trim();
    if (!text) return;
    chatInput.value = '';
    addMsg('user', text);
    await doChat({ message: text, aiEnabled });
  }
  async function doChat(payload) {
    const btn = document.getElementById('send'); btn.disabled = true;
    const tbtn = document.getElementById('takeover-btn'); if (tbtn) tbtn.disabled = true;
    try {
      if (typeof window.__dshShell !== 'undefined' && window.__dshShell.browserChat) {
        const r = await window.__dshShell.browserChat(payload);
        if (r && r.humanInLoop) {
          document.getElementById('takeover-txt').textContent = '🔐 ' + (r.reason || '需要人工操作');
          document.getElementById('takeover').classList.remove('hidden');
          addMsg('ai', r.reply || '需要人工操作');
        } else if (r && r.ok) {
          document.getElementById('takeover').classList.add('hidden');
          if (r.toolLogs && r.toolLogs.length) r.toolLogs.forEach(t => addMsg('tool', t));
          addMsg('ai', r.reply || '(空回复)');
        } else { addMsg('err', (r && r.error) || '调用失败'); }
      } else {
        const page = await wv.executeJavaScript(`(() => { const m = document.querySelector('main, article, #content') || document.body; return JSON.stringify({title:document.title, text:(m.innerText||'').replace(/\\s+/g,' ').trim().slice(0,400)}); })()`).then(r => JSON.parse(r));
        addMsg('ai', '（壳桥不可用）当前页面: ' + page.title + '\n' + page.text);
      }
    } catch (e) { addMsg('err', '错误: ' + e.message); }
    finally { btn.disabled = false; if (tbtn) tbtn.disabled = false; }
  }
  document.getElementById('send').addEventListener('click', sendChat);
  chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
  document.getElementById('takeover-btn').addEventListener('click', () => {
    document.getElementById('takeover').classList.add('hidden');
    addMsg('user', '（已在页面中手动完成操作，继续）');
    doChat({ continue: true, aiEnabled });
  });
</script>
</body>
</html>
