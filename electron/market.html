<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>技能与插件市场</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --border:#e5e7eb; --text:#1f2328; --sub:#656d76; --accent:#4D6BFE; --ok:#2da44e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; background:#fff; border-bottom:1px solid var(--border); }
  header h1 { font-size:16px; font-weight:600; flex:1; }
  .search { border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:13px; width:220px; }
  .tabs { display:flex; gap:6px; }
  .tab { padding:6px 16px; border-radius:999px; border:1px solid var(--border); background:#fff; font-size:13px; cursor:pointer; color:var(--sub); }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { flex:1; overflow-y:auto; padding:16px 20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start; }
  .card .badge { width:40px; height:40px; border-radius:9px; background:#eef1ff; color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; flex-shrink:0; }
  .card .info { flex:1; }
  .card h3 { font-size:14px; font-weight:600; margin-bottom:3px; }
  .card .desc { font-size:12px; color:var(--sub); line-height:1.5; }
  .card .meta { font-size:11px; color:var(--sub); margin-top:5px; }
  .btn { border:none; border-radius:7px; padding:7px 16px; font-size:13px; cursor:pointer; flex-shrink:0; }
  .btn.install { background:var(--accent); color:#fff; }
  .btn.installed { background:#fff; color:#d1242f; border:1px solid #d1242f; cursor:pointer; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1f2328; color:#fff; padding:9px 18px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; }
  .toast.show { opacity:1; }
  .empty { text-align:center; color:var(--sub); font-size:13px; padding:40px 0; }
  footer { padding:10px 20px; background:#fff; border-top:1px solid var(--border); font-size:12px; color:var(--sub); display:flex; gap:14px; }
  footer a { color:var(--accent); cursor:pointer; text-decoration:none; }
</style>
</head>
<body>
<header>
  <h1>技能与插件市场</h1>
  <input class="search" id="search" placeholder="搜索名称 / 描述 / ID…">
  <div class="tabs">
    <button class="tab active" data-type="skill">技能</button>
    <button class="tab" data-type="plugin">插件</button>
  </div>
</header>
<main id="list"></main>
<footer>
  <span>安装后重启生效</span>
  <a id="openDir">打开安装目录</a>
</footer>
<div class="toast" id="toast"></div>

<script>
  let current = 'skill';
  let allItems = [];
  const $ = (s) => document.querySelector(s);
  const listEl = $('#list');

  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);
  }

  function render(items, installed) {
    listEl.innerHTML = '';
    if (!items || !items.length) { listEl.innerHTML = '<div class="empty">无匹配条目</div>'; return; }
    for (const it of items) {
      const key = current + ':' + it.id;
      const isInst = !!installed[key];
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="badge">${(it.name || '?').slice(0, 1)}</div>
        <div class="info">
          <h3>${it.name || it.id}</h3>
          <div class="desc">${it.description || ''}</div>
          <div class="meta">v${it.version || '1.0'} · ${it.author || 'DSH'}${it.builtin ? ' · 内置' : ''}</div>
        </div>
        <button class="btn ${isInst ? 'installed' : 'install'}" data-id="${it.id}" data-act="${isInst ? 'uninstall' : 'install'}">${isInst ? '卸载' : '安装'}</button>`;
      const btn = card.querySelector('.btn');
      btn.addEventListener('click', async () => {
        if (btn.dataset.act === 'install') {
          btn.disabled = true; btn.textContent = '安装中…';
          const r = await window.market.install(current, it.id);
          toast(r.message);
          if (r.ok) { btn.dataset.act = 'uninstall'; btn.classList.remove('install'); btn.classList.add('installed'); btn.textContent = '卸载'; btn.disabled = false; }
          else { btn.textContent = '安装'; btn.disabled = false; }
        } else {
          btn.disabled = true; btn.textContent = '卸载中…';
          const r = await window.market.uninstall(current, it.id);
          toast(r.message);
          if (r.ok) { btn.dataset.act = 'install'; btn.classList.remove('installed'); btn.classList.add('install'); btn.textContent = '安装'; btn.disabled = false; }
          else { btn.textContent = '卸载'; btn.disabled = false; }
        }
      });
      listEl.appendChild(card);
    }
  }

  async function load() {
    listEl.innerHTML = '<div class="empty">加载中…</div>';
    const data = await window.market.list(current);
    allItems = data.items || [];
    applyFilter(data.installed || {});
  }

  function applyFilter(installed) {
    const q = ($('#search').value || '').trim().toLowerCase();
    const items = q ? allItems.filter((it) =>
      ((it.name || '') + ' ' + (it.description || '') + ' ' + (it.id || '')).toLowerCase().includes(q)
    ) : allItems;
    render(items, installed);
  }

  document.querySelectorAll('.tab').forEach((t) => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active'));
      t.classList.add('active');
      current = t.dataset.type;
      load();
    });
  });
  $('#search').addEventListener('input', () => applyFilter({}));
  $('#openDir').addEventListener('click', () => window.market.openDir());

  load();
</script>
</body>
</html>
